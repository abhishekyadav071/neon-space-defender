<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Space Defender</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #0a0a1a;
            overflow: hidden;
            color: #fff;
        }

        #gameCanvas {
            display: block;
            background: radial-gradient(ellipse at center, #1a1a3a 0%, #0a0a1a 100%);
            margin: 0 auto;
            box-shadow: 0 0 50px rgba(0, 255, 255, 0.3);
        }

        .ui-overlay {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 800px;
            max-width: 100%;
            pointer-events: none;
        }

        .hud {
            display: flex;
            justify-content: space-between;
            padding: 20px;
            font-size: 18px;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.8);
            pointer-events: none;
        }

        .hud-item {
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 5px;
            border: 2px solid #00ffff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
        }

        .health-bar {
            width: 200px;
            height: 20px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #00ffff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
        }

        .health-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff0000, #00ff00);
            transition: width 0.3s;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.8);
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.9);
            pointer-events: all;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            font-size: 64px;
            margin-bottom: 20px;
            text-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff;
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { text-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff; }
            50% { text-shadow: 0 0 30px #00ffff, 0 0 60px #00ffff, 0 0 80px #00ffff; }
        }

        .btn {
            padding: 15px 40px;
            font-size: 24px;
            background: linear-gradient(45deg, #00ffff, #0080ff);
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px;
            font-family: 'Courier New', monospace;
            color: #000;
            font-weight: bold;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
            transition: all 0.3s;
            pointer-events: all;
        }

        .btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.8);
        }

        .instructions {
            margin: 30px 0;
            text-align: center;
            font-size: 16px;
            line-height: 1.8;
        }

        .powerup-indicator {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            pointer-events: none;
        }

        .powerup-icon {
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
            border: 2px solid #ffff00;
            box-shadow: 0 0 15px rgba(255, 255, 0, 0.5);
            font-size: 14px;
        }

        .score-display {
            font-size: 48px;
            margin: 20px 0;
            text-shadow: 0 0 20px #00ff00;
        }

        .leaderboard {
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #00ffff;
            margin: 20px 0;
        }

        .leaderboard-entry {
            display: flex;
            justify-content: space-between;
            padding: 5px 20px;
            margin: 5px 0;
            min-width: 300px;
        }

        @media (max-width: 850px) {
            #gameCanvas {
                width: 100vw !important;
                height: 100vh !important;
            }
            .ui-overlay {
                width: 100vw;
            }
            h1 {
                font-size: 48px;
            }
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    
    <div class="ui-overlay">
        <div class="hud">
            <div class="hud-item">Score: <span id="score">0</span></div>
            <div class="hud-item">Level: <span id="level">1</span></div>
            <div class="hud-item">
                <div class="health-bar">
                    <div class="health-fill" id="healthFill" style="width: 100%;"></div>
                </div>
            </div>
        </div>
        <div class="powerup-indicator" id="powerupIndicator"></div>
    </div>

    <div id="startScreen" class="screen">
    <h1>NEON SPACE DEFENDER</h1>

    <div class="instructions">
        <p>Use ARROW KEYS or WASD to move</p>
        <p>Press SPACE to shoot</p>
        <p>Collect power-ups and defeat enemies!</p>
        <p>Boss fight every 5 levels!</p>
    </div>

    <button class="btn" onclick="startGame()">START GAME</button>

    <div class="leaderboard" id="leaderboard"></div>

    <!-- 🔥 Creator Info -->
    <div style="
        margin-top: 25px;
        text-align: center;
        color: #00ffff;
        font-size: 14px;
    ">
        🎮 Created by <b>Abhishek Yadav</b>

        <div style="margin-top: 10px;">
            <a href="https://www.linkedin.com/in/abhi-yadav241372" target="_blank" style="
                margin: 5px;
                padding: 6px 12px;
                background: #0077b5;
                color: white;
                border-radius: 6px;
                text-decoration: none;
                font-size: 13px;
            ">
                🔗 LinkedIn
            </a>

            <a href="https://github.com/abhishekyadav071" target="_blank" style="
                margin: 5px;
                padding: 6px 12px;
                background: #333;
                color: white;
                border-radius: 6px;
                text-decoration: none;
                font-size: 13px;
            ">
                💻 GitHub
            </a>
        </div>
    </div>
</div>

    <div id="pauseScreen" class="screen hidden">
        <h1>PAUSED</h1>
        <button class="btn" onclick="resumeGame()">RESUME</button>
        <button class="btn" onclick="restartGame()">RESTART</button>
    </div>

    <div id="gameOverScreen" class="screen hidden">
        <h1>GAME OVER</h1>
        <div class="score-display">Score: <span id="finalScore">0</span></div>
        <button class="btn" onclick="restartGame()">PLAY AGAIN</button>
        <button class="btn" onclick="showStartScreen()">MAIN MENU</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Audio Context
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        // Game State
        let gameState = 'start'; // start, playing, paused, gameOver
        let score = 0;
        let level = 1;
        let enemiesKilled = 0;
        let lastTime = 0;

        // Game Objects
        const player = {
            x: canvas.width / 2,
            y: canvas.height - 100,
            width: 40,
            height: 40,
            speed: 5,
            health: 100,
            maxHealth: 100,
            bullets: [],
            powerups: {
                shield: 0,
                doubleBullets: 0,
                speedBoost: 0
            }
        };

        const keys = {};
        let enemies = [];
        let powerups = [];
        let particles = [];
        let stars = [];
        let boss = null;

        // Initialize stars
        for (let i = 0; i < 100; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2,
                speed: Math.random() * 2 + 1
            });
        }

        // Enemy types
        const enemyTypes = [
            { color: '#ff0080', size: 30, health: 1, speed: 2, score: 10 },
            { color: '#ff8000', size: 35, health: 2, speed: 1.5, score: 20 },
            { color: '#8000ff', size: 40, health: 3, speed: 1, score: 30 },
            { color: '#00ff80', size: 25, health: 1, speed: 3, score: 15 }
        ];

        // Sound effects
        function playSound(frequency, duration, type = 'sine') {
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.frequency.value = frequency;
            oscillator.type = type;
            
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            
            oscillator.start(audioCtx.currentTime);
            oscillator.stop(audioCtx.currentTime + duration);
        }

        function shootSound() {
            playSound(800, 0.1, 'square');
        }

        function explosionSound() {
            playSound(100, 0.3, 'sawtooth');
        }

        function powerupSound() {
            playSound(1000, 0.2, 'sine');
            setTimeout(() => playSound(1200, 0.2, 'sine'), 100);
        }

        function hitSound() {
            playSound(200, 0.1, 'square');
        }

        // Event Listeners
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            
            if (e.key === ' ' && gameState === 'playing') {
                e.preventDefault();
                shoot();
            }
            
            if (e.key === 'Escape' && gameState === 'playing') {
                pauseGame();
            } else if (e.key === 'Escape' && gameState === 'paused') {
                resumeGame();
            }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        function shoot() {
            const bulletSpeed = 8;
            
            if (player.powerups.doubleBullets > 0) {
                player.bullets.push({
                    x: player.x - 10,
                    y: player.y,
                    width: 4,
                    height: 15,
                    speed: bulletSpeed
                });
                player.bullets.push({
                    x: player.x + 10,
                    y: player.y,
                    width: 4,
                    height: 15,
                    speed: bulletSpeed
                });
            } else {
                player.bullets.push({
                    x: player.x,
                    y: player.y,
                    width: 4,
                    height: 15,
                    speed: bulletSpeed
                });
            }
            
            shootSound();
        }

        function spawnEnemy() {
            const typeIndex = Math.min(Math.floor(level / 2), enemyTypes.length - 1);
            const type = enemyTypes[Math.floor(Math.random() * (typeIndex + 1))];
            
            enemies.push({
                x: Math.random() * (canvas.width - type.size),
                y: -type.size,
                width: type.size,
                height: type.size,
                speed: type.speed + (level * 0.1),
                health: type.health,
                maxHealth: type.health,
                color: type.color,
                score: type.score,
                angle: 0
            });
        }

        function spawnBoss() {
            boss = {
                x: canvas.width / 2,
                y: -100,
                width: 80,
                height: 80,
                speed: 1,
                health: 50 + (level * 10),
                maxHealth: 50 + (level * 10),
                color: '#ff0000',
                score: 500,
                angle: 0,
                phase: 0,
                shootTimer: 0
            };
        }

        function spawnPowerup(x, y) {
            const types = ['shield', 'doubleBullets', 'speedBoost'];
            const type = types[Math.floor(Math.random() * types.length)];
            
            powerups.push({
                x: x,
                y: y,
                width: 25,
                height: 25,
                speed: 2,
                type: type,
                angle: 0
            });
        }

        function createParticles(x, y, color, count = 20) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    size: Math.random() * 4 + 2,
                    color: color,
                    life: 1
                });
            }
        }

        function update(deltaTime) {
            if (gameState !== 'playing') return;

            const dt = deltaTime / 16.67; // Normalize to 60fps

            // Update player
            const speed = player.speed * (player.powerups.speedBoost > 0 ? 1.5 : 1) * dt;
            
            if ((keys['ArrowLeft'] || keys['a']) && player.x > 20) {
                player.x -= speed;
            }
            if ((keys['ArrowRight'] || keys['d']) && player.x < canvas.width - 20) {
                player.x += speed;
            }
            if ((keys['ArrowUp'] || keys['w']) && player.y > 20) {
                player.y -= speed;
            }
            if ((keys['ArrowDown'] || keys['s']) && player.y < canvas.height - 20) {
                player.y += speed;
            }

            // Update powerup timers
            for (let key in player.powerups) {
                if (player.powerups[key] > 0) {
                    player.powerups[key] -= deltaTime;
                    if (player.powerups[key] <= 0) {
                        player.powerups[key] = 0;
                    }
                }
            }

            // Update bullets
            player.bullets = player.bullets.filter(bullet => {
                bullet.y -= bullet.speed * dt;
                return bullet.y > -bullet.height;
            });

            // Update stars
            stars.forEach(star => {
                star.y += star.speed * dt;
                if (star.y > canvas.height) {
                    star.y = 0;
                    star.x = Math.random() * canvas.width;
                }
            });

            // Spawn enemies
            if (Math.random() < 0.02 * (1 + level * 0.1) && !boss) {
                spawnEnemy();
            }

            // Boss logic
            if (boss) {
                boss.y += boss.speed * dt;
                boss.angle += 0.02 * dt;
                
                if (boss.y < 100) {
                    boss.y += boss.speed * dt;
                } else {
                    boss.x += Math.sin(boss.angle * 2) * 3 * dt;
                    boss.x = Math.max(boss.width / 2, Math.min(canvas.width - boss.width / 2, boss.x));
                }

                boss.shootTimer += deltaTime;
                if (boss.shootTimer > 1000) {
                    boss.shootTimer = 0;
                    // Boss shoots
                    enemies.push({
                        x: boss.x,
                        y: boss.y + boss.height / 2,
                        width: 15,
                        height: 15,
                        speed: 3,
                        health: 1,
                        maxHealth: 1,
                        color: '#ff00ff',
                        score: 0,
                        angle: 0
                    });
                    shootSound();
                }

                // Check boss bullet collision
                player.bullets = player.bullets.filter(bullet => {
                    if (checkCollision(bullet, boss)) {
                        boss.health -= 1;
                        createParticles(bullet.x, bullet.y, boss.color, 10);
                        hitSound();
                        
                        if (boss.health <= 0) {
                            score += boss.score;
                            createParticles(boss.x, boss.y, boss.color, 50);
                            explosionSound();
                            boss = null;
                            level++;
                            enemiesKilled = 0;
                            if (Math.random() < 0.5) {
                                spawnPowerup(bullet.x, bullet.y);
                            }
                        }
                        return false;
                    }
                    return true;
                });

                // Check boss player collision
                if (checkCollision(player, boss) && player.powerups.shield <= 0) {
                    player.health -= 20 * (deltaTime / 16.67);
                    if (player.health <= 0) {
                        gameOver();
                    }
                }
            }

            // Update enemies
            enemies = enemies.filter(enemy => {
                enemy.y += enemy.speed * dt;
                enemy.angle += 0.05 * dt;
                
                // Check bullet collision
                let hit = false;
                player.bullets = player.bullets.filter(bullet => {
                    if (checkCollision(bullet, enemy)) {
                        enemy.health -= 1;
                        createParticles(bullet.x, bullet.y, enemy.color, 5);
                        hitSound();
                        
                        if (enemy.health <= 0) {
                            score += enemy.score;
                            enemiesKilled++;
                            createParticles(enemy.x, enemy.y, enemy.color, 15);
                            explosionSound();
                            
                            // Spawn powerup chance
                            if (Math.random() < 0.1) {
                                spawnPowerup(enemy.x, enemy.y);
                            }
                            
                            // Check for boss
                            if (enemiesKilled >= 20 && level % 5 === 0 && !boss) {
                                spawnBoss();
                            }
                            
                            hit = true;
                        }
                        return false;
                    }
                    return true;
                });
                
                if (hit && enemy.health <= 0) return false;

                // Check player collision
                if (checkCollision(player, enemy)) {
                    if (player.powerups.shield <= 0) {
                        player.health -= 10;
                        hitSound();
                        if (player.health <= 0) {
                            gameOver();
                        }
                    }
                    createParticles(enemy.x, enemy.y, enemy.color, 15);
                    explosionSound();
                    return false;
                }

                return enemy.y < canvas.height + enemy.height;
            });

            // Update powerups
            powerups = powerups.filter(powerup => {
                powerup.y += powerup.speed * dt;
                powerup.angle += 0.1 * dt;

                if (checkCollision(player, powerup)) {
                    player.powerups[powerup.type] = 10000; // 10 seconds
                    powerupSound();
                    createParticles(powerup.x, powerup.y, '#ffff00', 20);
                    return false;
                }

                return powerup.y < canvas.height;
            });

            // Update particles
            particles = particles.filter(particle => {
                particle.x += particle.vx * dt;
                particle.y += particle.vy * dt;
                particle.vy += 0.2 * dt;
                particle.life -= 0.02 * dt;
                return particle.life > 0;
            });

            // Level up
            if (enemiesKilled >= 20 && !boss) {
                level++;
                enemiesKilled = 0;
            }

            // Update UI
            document.getElementById('score').textContent = score;
            document.getElementById('level').textContent = level;
            document.getElementById('healthFill').style.width = (player.health / player.maxHealth * 100) + '%';

            // Update powerup indicators
            const powerupIndicator = document.getElementById('powerupIndicator');
            powerupIndicator.innerHTML = '';
            
            if (player.powerups.shield > 0) {
                const div = document.createElement('div');
                div.className = 'powerup-icon';
                div.textContent = '🛡️ Shield';
                powerupIndicator.appendChild(div);
            }
            if (player.powerups.doubleBullets > 0) {
                const div = document.createElement('div');
                div.className = 'powerup-icon';
                div.textContent = '⚡ Double Shot';
                powerupIndicator.appendChild(div);
            }
            if (player.powerups.speedBoost > 0) {
                const div = document.createElement('div');
                div.className = 'powerup-icon';
                div.textContent = '💨 Speed Boost';
                powerupIndicator.appendChild(div);
            }
        }

        function checkCollision(obj1, obj2) {
            return obj1.x < obj2.x + obj2.width &&
                   obj1.x + obj1.width > obj2.x &&
                   obj1.y < obj2.y + obj2.height &&
                   obj1.y + obj1.height > obj2.y;
        }

        function draw() {
            // Clear canvas
            ctx.fillStyle = '#0a0a1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw stars
            stars.forEach(star => {
                ctx.fillStyle = 'rgba(255, 255, 255, ' + (star.size / 2) + ')';
                ctx.fillRect(star.x, star.y, star.size, star.size);
            });

            // Draw particles
            particles.forEach(particle => {
                ctx.save();
                ctx.globalAlpha = particle.life;
                ctx.fillStyle = particle.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = particle.color;
                ctx.fillRect(particle.x, particle.y, particle.size, particle.size);
                ctx.restore();
            });

            // Draw player
            ctx.save();
            ctx.translate(player.x, player.y);
            
            // Shield effect
            if (player.powerups.shield > 0) {
                ctx.strokeStyle = '#00ffff';
                ctx.lineWidth = 3;
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#00ffff';
                ctx.beginPath();
                ctx.arc(0, 0, player.width, 0, Math.PI * 2);
                ctx.stroke();
            }

            // Player ship
            ctx.fillStyle = '#00ffff';
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#00ffff';
            ctx.beginPath();
            ctx.moveTo(0, -player.height / 2);
            ctx.lineTo(-player.width / 2, player.height / 2);
            ctx.lineTo(0, player.height / 3);
            ctx.lineTo(player.width / 2, player.height / 2);
            ctx.closePath();
            ctx.fill();

            // Engine glow
            ctx.fillStyle = '#ff8800';
            ctx.shadowColor = '#ff8800';
            ctx.beginPath();
            ctx.arc(0, player.height / 2, 5, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();

            // Draw bullets
            player.bullets.forEach(bullet => {
                ctx.fillStyle = '#00ff00';
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#00ff00';
                ctx.fillRect(bullet.x - bullet.width / 2, bullet.y, bullet.width, bullet.height);
            });

            // Draw enemies
            enemies.forEach(enemy => {
                ctx.save();
                ctx.translate(enemy.x, enemy.y);
                ctx.rotate(enemy.angle);
                
                ctx.fillStyle = enemy.color;
                ctx.shadowBlur = 15;
                ctx.shadowColor = enemy.color;
                ctx.fillRect(-enemy.width / 2, -enemy.height / 2, enemy.width, enemy.height);

                // Health bar for enemies with more than 1 health
                if (enemy.maxHealth > 1) {
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(-enemy.width / 2, -enemy.height / 2 - 10, enemy.width, 4);
                    ctx.fillStyle = '#ff0000';
                    ctx.fillRect(-enemy.width / 2, -enemy.height / 2 - 10, enemy.width * (enemy.health / enemy.maxHealth), 4);
                }

                ctx.restore();
            });

            // Draw boss
            if (boss) {
                ctx.save();
                ctx.translate(boss.x, boss.y);
                ctx.rotate(boss.angle);

                // Boss body
                ctx.fillStyle = boss.color;
                ctx.shadowBlur = 30;
                ctx.shadowColor = boss.color;
                ctx.fillRect(-boss.width / 2, -boss.height / 2, boss.width, boss.height);

                // Boss details
                ctx.fillStyle = '#ffff00';
                ctx.fillRect(-boss.width / 3, -boss.height / 3, boss.width / 6, boss.height / 6);
                ctx.fillRect(boss.width / 6, -boss.height / 3, boss.width / 6, boss.height / 6);

                ctx.restore();

                // Boss health bar
                const barWidth = 200;
                const barHeight = 20;
                const barX = canvas.width / 2 - barWidth / 2;
                const barY = 30;

                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(barX - 5, barY - 5, barWidth + 10, barHeight + 10);

                ctx.strokeStyle = '#ff0000';
                ctx.lineWidth = 3;
                ctx.strokeRect(barX, barY, barWidth, barHeight);

                ctx.fillStyle = '#ff0000';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ff0000';
                ctx.fillRect(barX, barY, barWidth * (boss.health / boss.maxHealth), barHeight);

                ctx.fillStyle = '#ffffff';
                ctx.shadowBlur = 0;
                ctx.font = '14px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText('BOSS', canvas.width / 2, barY - 10);
            }

            // Draw powerups
            powerups.forEach(powerup => {
                ctx.save();
                ctx.translate(powerup.x, powerup.y);
                ctx.rotate(powerup.angle);

                let emoji = '⭐';
                if (powerup.type === 'shield') emoji = '🛡️';
                if (powerup.type === 'doubleBullets') emoji = '⚡';
                if (powerup.type === 'speedBoost') emoji = '💨';

                ctx.shadowBlur = 20;
                ctx.shadowColor = '#ffff00';
                ctx.font = '24px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(emoji, 0, 0);

                ctx.restore();
            });
        }

        function gameLoop(timestamp) {
            const deltaTime = timestamp - lastTime;
            lastTime = timestamp;

            update(deltaTime);
            draw();

            requestAnimationFrame(gameLoop);
        }

        function startGame() {
    // 👇 YE LINE ADD KARO
    document.getElementById("creatorName").style.display = "block";

    gameState = 'playing';
    score = 0;
    level = 1;
    enemiesKilled = 0;
    player.health = player.maxHealth;
    player.x = canvas.width / 2;
    player.y = canvas.height - 100;
    player.bullets = [];
    player.powerups = { shield: 0, doubleBullets: 0, speedBoost: 0 };
    enemies = [];
    powerups = [];
    particles = [];
    boss = null;

    document.getElementById('startScreen').classList.add('hidden');
    document.getElementById('pauseScreen').classList.add('hidden');
    document.getElementById('gameOverScreen').classList.add('hidden');

    // Resume audio context
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
}

        function pauseGame() {
            if (gameState === 'playing') {
                gameState = 'paused';
                document.getElementById('pauseScreen').classList.remove('hidden');
            }
        }

        function resumeGame() {
            gameState = 'playing';
            document.getElementById('pauseScreen').classList.add('hidden');
        }

        function gameOver() {
            gameState = 'gameOver';
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOverScreen').classList.remove('hidden');
            
            // Save to leaderboard
            saveScore(score);
            displayLeaderboard();
        }

        function restartGame() {
            startGame();
        }

        function showStartScreen() {
            gameState = 'start';
            document.getElementById('startScreen').classList.remove('hidden');
            document.getElementById('pauseScreen').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');
            displayLeaderboard();
        }

        function saveScore(score) {
            let leaderboard = JSON.parse(localStorage.getItem('spaceShooterLeaderboard') || '[]');
            leaderboard.push({ score: score, date: new Date().toLocaleDateString() });
            leaderboard.sort((a, b) => b.score - a.score);
            leaderboard = leaderboard.slice(0, 5); // Keep top 5
            localStorage.setItem('spaceShooterLeaderboard', JSON.stringify(leaderboard));
        }

        function displayLeaderboard() {
            const leaderboard = JSON.parse(localStorage.getItem('spaceShooterLeaderboard') || '[]');
            const leaderboardDiv = document.getElementById('leaderboard');
            
            if (leaderboard.length === 0) {
                leaderboardDiv.innerHTML = '<h2 style="text-align: center; margin: 10px;">🏆 LEADERBOARD 🏆</h2><p style="text-align: center;">No scores yet!</p>';
            } else {
                let html = '<h2 style="text-align: center; margin: 10px;">🏆 LEADERBOARD 🏆</h2>';
                leaderboard.forEach((entry, index) => {
                    html += `<div class="leaderboard-entry">
                        <span>${index + 1}. ${entry.score}</span>
                        <span>${entry.date}</span>
                    </div>`;
                });
                leaderboardDiv.innerHTML = html;
            }
        }

        // Initialize
        displayLeaderboard();
        requestAnimationFrame(gameLoop);
    </script>
